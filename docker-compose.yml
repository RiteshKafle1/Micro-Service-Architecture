version: '3.8'

services:
  mongo:
    image: mongo:5
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./UserService   
    container_name: user-service
    ports:
      - "4000:4000"
    depends_on:
      - mongo

volumes:
  mongo_data:
