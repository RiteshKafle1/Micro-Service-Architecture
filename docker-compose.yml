

services:
  mongo:
    image: mongodb/mongodb-community-server:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  user-service:
    build: ./UserService   
    container_name: user-service
    ports:
      - "4000:4000"
    depends_on:
      - mongo

  task-service:
    build: ./TaskService   
    container_name: task-service
    ports:
      - "4001:4001"
    depends_on:
      - mongo

volumes:
  mongo_data:
